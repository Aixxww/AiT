# AiT Production Deployment
# 用户部署专用 - 使用官方预构建镜像
#
# 一键部署命令:
# curl -fsSL https://raw.githubusercontent.com/Aixxww/AiT/main/scripts/install.sh | bash -s -- --docker
#
# 或手动部署:
# curl -O https://raw.githubusercontent.com/Aixxww/AiT/main/docker-compose.prod.yml
# docker compose -f docker-compose.prod.yml up -d

services:
  ait:
    image: ghcr.io/aixxww/ait/ait-backend:latest
    container_name: ait-trading
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${AIT_BACKEND_PORT:-8080}:8080"
    volumes:
      # Data directory for database and logs
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
    networks:
      - ait-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ait-frontend:
    image: ghcr.io/aixxww/ait/ait-frontend:latest
    container_name: ait-frontend
    restart: unless-stopped
    ports:
      - "${AIT_FRONTEND_PORT:-3000}:80"
    networks:
      - ait-network
    depends_on:
      - ait
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  ait-network:
    driver: bridge
